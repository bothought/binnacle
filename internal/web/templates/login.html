{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="dark light">
  <title>Sign in · binnacle</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login">
    <div class="login-brand">binnacle</div>
    <p class="lead">Server administration.</p>
    {{if .Error}}<div class="flash err-flash">{{.Error}}</div>{{end}}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="next" value="{{.Next}}">
      <label>username<input name="username" value="{{.Username}}" autocomplete="username" autofocus required></label>
      <label>password<input type="password" name="password" autocomplete="current-password" required></label>
      {{if .TOTP}}<label>one-time code<input name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*"></label>{{end}}
      <button type="submit">sign in</button>
    </form>
    <p class="login-hint">Local account. Forward-auth deployments sign in through their proxy instead.</p>
  </main>
</body>
</html>
{{end}}
